<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GTFS Timetable</title>
<style>
  body { font-family: sans-serif; font-size: 14px; max-width: 800px; margin: 40px auto; padding: 0 16px; color: #000; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  p.desc { color: #555; margin-top: 0; }
  label { display: block; margin-top: 12px; }
  input[type="text"] { width: 240px; padding: 4px; font-size: 14px; margin-top: 4px; }
  button { margin-top: 10px; padding: 5px 14px; font-size: 14px; cursor: pointer; display: block; }
  button:disabled { color: #999; cursor: not-allowed; }
  #status { margin-top: 8px; color: #555; }
  #searchWrap { position: relative; width: 240px; }
  #suggestions {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 10;
    background: #fff;
    border: 1px solid #ccc;
    border-top: none;
    max-height: 240px;
    overflow-y: auto;
  }
  .suggestion-item { padding: 5px 8px; cursor: pointer; font-size: 13px; }
  .suggestion-item .sug-id { color: #777; font-size: 12px; }
  .suggestion-item:hover, .suggestion-item.active { background: #eee; }
  #filterPanel { margin-top: 20px; }
  #filterPanel h2 { font-size: 14px; margin-bottom: 6px; }
  .filter-item { margin: 4px 0; }
  .filter-item label { display: inline; cursor: pointer; }
  table { margin-top: 20px; border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; vertical-align: top; }
  th { background: #eee; font-weight: bold; }
  td:first-child { width: 60px; font-weight: bold; white-space: nowrap; }
  td { font-family: monospace; }
  td:first-child { font-family: sans-serif; }
  sup { font-family: sans-serif; font-weight: bold; }
  #footnotes { margin-top: 10px; font-size: 12px; }
  #footnotes p { margin: 2px 0; }
</style>
</head>
<body>

<h1>GTFS Timetable</h1>

<label>Search for a stop
  <div id="searchWrap">
    <input type="text" id="stopSearchInput" placeholder="Stop name or stop_id" disabled autocomplete="off" />
    <div id="suggestions"></div>
  </div>
</label>
<button id="generateBtn" disabled>Go</button>
<button id="randomBtn" disabled>Random</button>
<div id="status">Loading...</div>

<div id="results"></div>

<script>
const BUCKETS = ["weekday", "saturday", "sunday"];
const BUCKET_LABELS = { weekday: "Weekday", saturday: "Saturday", sunday: "Sunday" };

let condensedByStop = null;
let routesLookup = null;
let directionsLookup = null;
let dayPatternsLookup = null;
let stopNamesLookup = null;
let currentStopId = null;
let selectedStems = new Set();

let stopIndex = [];        // [{ id, name }] for stops that have departures
let selectedStopId = null; // set when a suggestion (or URL/random) is chosen
let activeSuggestionIndex = -1;

const searchInput = () => document.getElementById("stopSearchInput");

document.getElementById("generateBtn").addEventListener("click", handleGenerateClick);
document.getElementById("randomBtn").addEventListener("click", randomTimetable);
window.addEventListener("DOMContentLoaded", loadReferenceData);
window.addEventListener("popstate", handlePopState);

document.addEventListener("click", (e) => {
  if (!document.getElementById("searchWrap").contains(e.target)) hideSuggestions();
});

document.addEventListener("DOMContentLoaded", () => {
  const input = document.getElementById("stopSearchInput");

  input.addEventListener("input", () => {
    selectedStopId = null;
    renderSuggestions(searchStops(input.value));
  });

  input.addEventListener("keydown", (e) => {
    const box = document.getElementById("suggestions");
    const visible = box.style.display === "block";
    if (e.key === "ArrowDown") {
      if (visible) { e.preventDefault(); moveSuggestionSelection(1); }
    } else if (e.key === "ArrowUp") {
      if (visible) { e.preventDefault(); moveSuggestionSelection(-1); }
    } else if (e.key === "Enter") {
      e.preventDefault();
      handleGenerateClick();
    } else if (e.key === "Escape") {
      hideSuggestions();
    }
  });
});

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

async function loadReferenceData() {
  try {
    const res = await fetch("condensed_stop_times.json");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    condensedByStop   = data.stops;
    routesLookup      = data.routes;
    directionsLookup  = data.directions;
    dayPatternsLookup = data.day_patterns || {};
    stopNamesLookup   = data.stop_names || {};

    buildStopIndex();

    searchInput().disabled = false;
    document.getElementById("generateBtn").disabled = false;
    document.getElementById("randomBtn").disabled = false;
    setStatus(`Loaded ${Object.keys(condensedByStop).length.toLocaleString()} stops.`);

    loadStopFromUrl();
  } catch (err) {
    setStatus("Error loading condensed_stop_times.json: " + err.message);
  }
}

function buildStopIndex() {
  stopIndex = Object.keys(condensedByStop)
    .filter(id => condensedByStop[id] && Object.keys(condensedByStop[id]).length > 0)
    .map(id => ({ id, name: stopNamesLookup[id] || id }));
}

function searchStops(query, limit = 20) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const results = [];
  for (const entry of stopIndex) {
    if (entry.id.toLowerCase().startsWith(q) || entry.name.toLowerCase().includes(q)) {
      results.push(entry);
      if (results.length >= limit) break;
    }
  }
  return results;
}

function renderSuggestions(results) {
  const box = document.getElementById("suggestions");
  box.innerHTML = "";
  activeSuggestionIndex = -1;
  if (results.length === 0) { box.style.display = "none"; return; }
  results.forEach(r => {
    const item = document.createElement("div");
    item.className = "suggestion-item";
    item.dataset.stopId = r.id;
    item.innerHTML = escapeHtml(r.name) + ' <span class="sug-id">(' + escapeHtml(r.id) + ")</span>";
    item.addEventListener("click", () => selectStop(r.id));
    box.appendChild(item);
  });
  box.style.display = "block";
}

function hideSuggestions() {
  const box = document.getElementById("suggestions");
  box.style.display = "none";
  box.innerHTML = "";
  activeSuggestionIndex = -1;
}

function moveSuggestionSelection(delta) {
  const items = Array.from(document.querySelectorAll(".suggestion-item"));
  if (items.length === 0) return;
  if (activeSuggestionIndex >= 0) items[activeSuggestionIndex].classList.remove("active");
  activeSuggestionIndex = (activeSuggestionIndex + delta + items.length) % items.length;
  items[activeSuggestionIndex].classList.add("active");
  items[activeSuggestionIndex].scrollIntoView({ block: "nearest" });
}

function handleGenerateClick() {
  const items = document.querySelectorAll(".suggestion-item");
  if (activeSuggestionIndex >= 0 && items[activeSuggestionIndex]) {
    selectStop(items[activeSuggestionIndex].dataset.stopId);
    return;
  }

  const raw = searchInput().value.trim();
  let stopId = selectedStopId;

  if (!stopId || `${stopNamesLookup[stopId] || stopId} (${stopId})` !== raw) {
    if (condensedByStop[raw]) {
      stopId = raw;
    } else {
      const results = searchStops(raw, 2);
      stopId = results.length >= 1 ? results[0].id : null;
    }
  }

  if (!stopId) {
    setStatus("No matching stop found. Pick a suggestion, or enter an exact stop_id.");
    return;
  }
  selectStop(stopId);
}

function selectStop(stopId) {
  selectedStopId = stopId;
  const name = stopNamesLookup[stopId] || stopId;
  searchInput().value = `${name} (${stopId})`;
  hideSuggestions();
  updateUrl(stopId);
  generateTimetable(stopId);
}

function updateUrl(stopId) {
  const url = new URL(window.location);
  url.searchParams.set("stop", stopId);
  window.history.pushState({ stopId }, "", url);
}

function loadStopFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const stopId = params.get("stop");
  if (!stopId) return;
  if (!condensedByStop[stopId]) {
    setStatus(`No departures found for stop ${stopId} (from URL).`);
    return;
  }
  selectedStopId = stopId;
  searchInput().value = `${stopNamesLookup[stopId] || stopId} (${stopId})`;
  generateTimetable(stopId);
}

function handlePopState() {
  const params = new URLSearchParams(window.location.search);
  const stopId = params.get("stop");
  if (stopId && condensedByStop && condensedByStop[stopId]) {
    selectedStopId = stopId;
    searchInput().value = `${stopNamesLookup[stopId] || stopId} (${stopId})`;
    generateTimetable(stopId);
  } else {
    selectedStopId = null;
    searchInput().value = "";
    document.getElementById("results").innerHTML = "";
    setStatus("Enter a stop name or stop_id.");
  }
}

function randomTimetable() {
  if (stopIndex.length === 0) return;
  const entry = stopIndex[Math.floor(Math.random() * stopIndex.length)];
  selectStop(entry.id);
}

function generateTimetable(stopId) {
  if (!stopId) { setStatus("Enter a stop name or stop_id."); return; }

  document.getElementById("results").innerHTML = "";

  const patterns = condensedByStop[stopId];
  if (!patterns || Object.keys(patterns).length === 0) {
    setStatus(`No departures found for stop ${stopId}.`);
    return;
  }

  currentStopId = stopId;
  const grouped = buildPatternGroups(patterns);
  const stems = Object.keys(grouped).sort();
  selectedStems = new Set(stems);

  const stopName = stopNamesLookup[stopId];
  const stopLabel = stopName ? `${stopName}` : stopId;

  const nameEl = document.createElement("p");
  nameEl.id = "stopName";
  nameEl.style.cssText = "font-size:16px; font-weight:bold; margin:16px 0 4px;";
  nameEl.textContent = stopLabel;
  document.getElementById("results").appendChild(nameEl);

  buildFilterPanel(grouped, stems);
  renderTable(grouped);

  const total = Object.values(patterns).reduce((s, e) => s + e.length, 0);
  setStatus(`${stems.length} route/direction(s), ${total} departures.`);
}

function buildFilterPanel(grouped, stems) {
  const results = document.getElementById("results");
  const div = document.createElement("div");
  div.id = "filterPanel";

  const h2 = document.createElement("h2");
  h2.textContent = "Routes / directions";
  div.appendChild(h2);

  stems.forEach(stem => {
    const data = grouped[stem];
    const item = document.createElement("div");
    item.className = "filter-item";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = "stem-" + stem;
    cb.checked = true;
    cb.addEventListener("change", () => {
      cb.checked ? selectedStems.add(stem) : selectedStems.delete(stem);
      renderTable(grouped);
    });

    const lbl = document.createElement("label");
    lbl.htmlFor = "stem-" + stem;
    lbl.textContent = " " + data.route_short_name + " " + data.direction;

    item.appendChild(cb);
    item.appendChild(lbl);
    div.appendChild(item);
  });

  results.appendChild(div);
}

function entryTime(e)  { return typeof e === "string" ? e : e[0]; }
function entryNotes(e) { return typeof e === "string" ? [] : e[1]; }

function dedupeAndSortEntries(entries) {
  const byTime = new Map();
  entries.forEach(e => {
    const t = entryTime(e);
    if (!byTime.has(t)) byTime.set(t, new Set());
    entryNotes(e).forEach(n => byTime.get(t).add(n));
  });
  return Array.from(byTime.keys()).sort().map(t => {
    const notes = Array.from(byTime.get(t)).sort();
    return notes.length ? [t, notes] : t;
  });
}

function bitsToDisplayBuckets(bits) {
  const out = new Set();
  if (bits.slice(0, 5).includes("1")) out.add("weekday");
  if (bits[5] === "1") out.add("saturday");
  if (bits[6] === "1") out.add("sunday");
  return Array.from(out);
}

function buildPatternGroups(patterns) {
  const grouped = {};
  for (const key in patterns) {
    const entries = patterns[key];
    const [routeId, directionId, bits] = key.split("|");
    const routeData = routesLookup[routeId];
    const direction = directionsLookup[String(directionId)];
    const stem = routeData.name + "|" + direction;
    if (!grouped[stem]) {
      grouped[stem] = { route_short_name: routeData.name, route_color: routeData.color, direction, patterns: {} };
    }
    bitsToDisplayBuckets(bits).forEach(bucket => {
      grouped[stem].patterns[bucket] = grouped[stem].patterns[bucket]
        ? grouped[stem].patterns[bucket].concat(entries)
        : entries.slice();
    });
  }
  for (const stem in grouped) {
    const p = grouped[stem].patterns;
    for (const b in p) p[b] = dedupeAndSortEntries(p[b]);
  }
  return grouped;
}

function buildStemLeafData(grouped) {
  const sl = {};
  for (let h = 0; h < 24; h++) sl[h] = { weekday: [], saturday: [], sunday: [] };

  for (const stem of selectedStems) {
    if (!grouped[stem]) continue;
    BUCKETS.forEach(bucket => {
      (grouped[stem].patterns[bucket] || []).forEach(e => {
        const time = entryTime(e);
        const hour = parseInt(time.split(":")[0], 10) % 24;
        sl[hour][bucket].push({ minutes: time.split(":")[1], notes: entryNotes(e) });
      });
    });
  }
  for (let h = 0; h < 24; h++)
    BUCKETS.forEach(b => sl[h][b].sort((a, z) => a.minutes.localeCompare(z.minutes)));
  return sl;
}

function assignFootnoteLetters(sl) {
  const map = new Map();
  let idx = 0;
  for (let h = 0; h < 24; h++)
    BUCKETS.forEach(b => sl[h][b].forEach(item =>
      item.notes.forEach(n => { if (!map.has(n)) map.set(n, letterForIndex(idx++)); })
    ));
  return map;
}

function letterForIndex(n) {
  let r = ""; n += 1;
  while (n > 0) { n--; r = String.fromCharCode(65 + n % 26) + r; n = Math.floor(n / 26); }
  return r;
}

function cellHtml(items, map) {
  return items.map(item => {
    const m = escapeHtml(item.minutes);
    if (!item.notes.length) return m;
    return m + "<sup>" + item.notes.map(n => map.get(n)).join(",") + "</sup>";
  }).join("  ");
}

function renderTable(grouped) {
  document.querySelectorAll("table, #footnotes").forEach(el => el.remove());
  const container = document.getElementById("results");

  if (selectedStems.size === 0) {
    const p = document.createElement("p");
    p.textContent = "No routes selected.";
    container.appendChild(p);
    return;
  }

  const sl = buildStemLeafData(grouped);
  const letterMap = assignFootnoteLetters(sl);

  const table = document.createElement("table");
  const thead = table.createTHead();
  const hr = thead.insertRow();
  ["Hour", ...BUCKETS.map(b => BUCKET_LABELS[b])].forEach(txt => {
    const th = document.createElement("th");
    th.textContent = txt;
    hr.appendChild(th);
  });

  const tbody = table.createTBody();
  for (let h = 0; h < 24; h++) {
    const row = tbody.insertRow();
    const hourCell = row.insertCell();
    hourCell.textContent = formatHour(h);
    BUCKETS.forEach(b => {
      const cell = row.insertCell();
      cell.innerHTML = cellHtml(sl[h][b], letterMap);
    });
  }

  container.appendChild(table);

  if (letterMap.size > 0) {
    const fn = document.createElement("div");
    fn.id = "footnotes";
    Array.from(letterMap.entries())
      .sort((a, b) => a[1].length - b[1].length || a[1].localeCompare(b[1]))
      .forEach(([note, letter]) => {
        const p = document.createElement("p");
        p.innerHTML = "<sup>" + letter + "</sup> " + escapeHtml(note);
        fn.appendChild(p);
      });
    container.appendChild(fn);
  }
}

function formatHour(h) {
  const w = h % 24;
  if (w === 0) return "12 AM";
  if (w < 12) return w + " AM";
  if (w === 12) return "12 PM";
  return (w - 12) + " PM";
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
</script>
</body>
</html>
