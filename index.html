<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GTFS Timetable</title>
<style>
  body { font-family: sans-serif; font-size: 14px; max-width: 800px; margin: 40px auto; padding: 0 16px; color: #000; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  p.desc { color: #555; margin-top: 0; }
  label { display: block; margin-top: 12px; }
  input[type="text"] { width: 240px; padding: 4px; font-size: 14px; margin-top: 4px; }
  button { margin-top: 10px; padding: 5px 14px; font-size: 14px; cursor: pointer; display: block; }
  button:disabled { color: #999; cursor: not-allowed; }
  #status { margin-top: 8px; color: #555; }
  #filterPanel { margin-top: 20px; }
  #filterPanel h2 { font-size: 14px; margin-bottom: 6px; }
  .filter-item { margin: 4px 0; }
  .filter-item label { display: inline; cursor: pointer; }
  table { margin-top: 20px; border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; vertical-align: top; }
  th { background: #eee; font-weight: bold; }
  td:first-child { width: 60px; font-weight: bold; white-space: nowrap; }
  td { font-family: monospace; }
  td:first-child { font-family: sans-serif; }
  sup { font-family: sans-serif; font-weight: bold; }
  #footnotes { margin-top: 10px; font-size: 12px; }
  #footnotes p { margin: 2px 0; }
</style>
</head>
<body>

<h1>GTFS Timetable</h1>

<label>stop_id
  <input type="text" id="stopIdInput" placeholder="e.g. 14065" disabled />
</label>
<button id="generateBtn" disabled>Generate timetable</button>

<div id="results"></div>

<script>
const BUCKETS = ["weekday", "saturday", "sunday"];
const BUCKET_LABELS = { weekday: "Weekday (M–F)", saturday: "Saturday", sunday: "Sunday" };

let condensedByStop = null;
let routesLookup = null;
let directionsLookup = null;
let dayPatternsLookup = null;
let currentStopId = null;
let selectedStems = new Set();

const weekDates = getCurrentWeekDates();

document.getElementById("generateBtn").addEventListener("click", generateTimetable);
window.addEventListener("DOMContentLoaded", loadReferenceData);

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

function getCurrentWeekDates() {
  const monday = new Date(2026, 2, 2);
  monday.setHours(0, 0, 0, 0);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d);
  }
  return dates;
}

function formatDateDisplay(d) {
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}

async function loadReferenceData() {
  try {
    const res = await fetch("condensed_stop_times.json");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    condensedByStop   = data.stops;
    routesLookup      = data.routes;
    directionsLookup  = data.directions;
    dayPatternsLookup = data.day_patterns || {};
    document.getElementById("stopIdInput").disabled = false;
    document.getElementById("generateBtn").disabled = false;
    setStatus(`Loaded ${Object.keys(condensedByStop).length.toLocaleString()} stops.`);
  } catch (err) {
    setStatus("Error loading condensed_stop_times.json: " + err.message);
  }
}

function generateTimetable() {
  const stopId = document.getElementById("stopIdInput").value.trim();
  if (!stopId) { setStatus("Enter a stop_id."); return; }

  document.getElementById("results").innerHTML = "";

  const patterns = condensedByStop[stopId];
  if (!patterns || Object.keys(patterns).length === 0) {
    setStatus(`No departures found for stop ${stopId}.`);
    return;
  }

  currentStopId = stopId;
  const grouped = buildPatternGroups(patterns);
  const stems = Object.keys(grouped).sort();
  selectedStems = new Set(stems);

  buildFilterPanel(grouped, stems);
  renderTable(grouped);

  const total = Object.values(patterns).reduce((s, e) => s + e.length, 0);
  setStatus(`Stop ${stopId}: ${stems.length} route/direction(s), ${total} departures.`);
}

function buildFilterPanel(grouped, stems) {
  const results = document.getElementById("results");
  const div = document.createElement("div");
  div.id = "filterPanel";

  const h2 = document.createElement("h2");
  h2.textContent = "Routes / directions";
  div.appendChild(h2);

  stems.forEach(stem => {
    const data = grouped[stem];
    const item = document.createElement("div");
    item.className = "filter-item";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = "stem-" + stem;
    cb.checked = true;
    cb.addEventListener("change", () => {
      cb.checked ? selectedStems.add(stem) : selectedStems.delete(stem);
      renderTable(grouped);
    });

    const lbl = document.createElement("label");
    lbl.htmlFor = "stem-" + stem;
    lbl.textContent = " " + data.route_short_name + " — " + data.direction;

    item.appendChild(cb);
    item.appendChild(lbl);
    div.appendChild(item);
  });

  results.appendChild(div);
}

function entryTime(e)  { return typeof e === "string" ? e : e[0]; }
function entryNotes(e) { return typeof e === "string" ? [] : e[1]; }

function dedupeAndSortEntries(entries) {
  const byTime = new Map();
  entries.forEach(e => {
    const t = entryTime(e);
    if (!byTime.has(t)) byTime.set(t, new Set());
    entryNotes(e).forEach(n => byTime.get(t).add(n));
  });
  return Array.from(byTime.keys()).sort().map(t => {
    const notes = Array.from(byTime.get(t)).sort();
    return notes.length ? [t, notes] : t;
  });
}

function bitsToDisplayBuckets(bits) {
  const out = new Set();
  if (bits.slice(0, 5).includes("1")) out.add("weekday");
  if (bits[5] === "1") out.add("saturday");
  if (bits[6] === "1") out.add("sunday");
  return Array.from(out);
}

function buildPatternGroups(patterns) {
  const grouped = {};
  for (const key in patterns) {
    const entries = patterns[key];
    const [routeId, directionId, bits] = key.split("|");
    const routeData = routesLookup[routeId];
    const direction = directionsLookup[String(directionId)];
    const stem = routeData.name + "|" + direction;
    if (!grouped[stem]) {
      grouped[stem] = { route_short_name: routeData.name, route_color: routeData.color, direction, patterns: {} };
    }
    bitsToDisplayBuckets(bits).forEach(bucket => {
      grouped[stem].patterns[bucket] = grouped[stem].patterns[bucket]
        ? grouped[stem].patterns[bucket].concat(entries)
        : entries.slice();
    });
  }
  for (const stem in grouped) {
    const p = grouped[stem].patterns;
    for (const b in p) p[b] = dedupeAndSortEntries(p[b]);
  }
  return grouped;
}

function buildStemLeafData(grouped) {
  const sl = {};
  for (let h = 0; h < 24; h++) sl[h] = { weekday: [], saturday: [], sunday: [] };

  for (const stem of selectedStems) {
    if (!grouped[stem]) continue;
    BUCKETS.forEach(bucket => {
      (grouped[stem].patterns[bucket] || []).forEach(e => {
        const time = entryTime(e);
        const hour = parseInt(time.split(":")[0], 10) % 24;
        sl[hour][bucket].push({ minutes: time.split(":")[1], notes: entryNotes(e) });
      });
    });
  }
  for (let h = 0; h < 24; h++)
    BUCKETS.forEach(b => sl[h][b].sort((a, z) => a.minutes.localeCompare(z.minutes)));
  return sl;
}

function assignFootnoteLetters(sl) {
  const map = new Map();
  let idx = 0;
  for (let h = 0; h < 24; h++)
    BUCKETS.forEach(b => sl[h][b].forEach(item =>
      item.notes.forEach(n => { if (!map.has(n)) map.set(n, letterForIndex(idx++)); })
    ));
  return map;
}

function letterForIndex(n) {
  let r = ""; n += 1;
  while (n > 0) { n--; r = String.fromCharCode(65 + n % 26) + r; n = Math.floor(n / 26); }
  return r;
}

function cellHtml(items, map) {
  return items.map(item => {
    const m = escapeHtml(item.minutes);
    if (!item.notes.length) return m;
    return m + "<sup>" + item.notes.map(n => map.get(n)).join(",") + "</sup>";
  }).join("  ");
}

function renderTable(grouped) {
  document.querySelectorAll("table, #footnotes").forEach(el => el.remove());
  const container = document.getElementById("results");

  if (selectedStems.size === 0) {
    const p = document.createElement("p");
    p.textContent = "No routes selected.";
    container.appendChild(p);
    return;
  }

  const sl = buildStemLeafData(grouped);
  const letterMap = assignFootnoteLetters(sl);

  const table = document.createElement("table");
  const thead = table.createTHead();
  const hr = thead.insertRow();
  ["Hour", ...BUCKETS.map(b => BUCKET_LABELS[b])].forEach(txt => {
    const th = document.createElement("th");
    th.textContent = txt;
    hr.appendChild(th);
  });

  const tbody = table.createTBody();
  for (let h = 0; h < 24; h++) {
    const hasData = BUCKETS.some(b => sl[h][b].length > 0);
    if (!hasData) continue;
    const row = tbody.insertRow();
    const hourCell = row.insertCell();
    hourCell.textContent = formatHour(h);
    BUCKETS.forEach(b => {
      const cell = row.insertCell();
      cell.innerHTML = cellHtml(sl[h][b], letterMap);
    });
  }

  container.appendChild(table);

  if (letterMap.size > 0) {
    const fn = document.createElement("div");
    fn.id = "footnotes";
    Array.from(letterMap.entries())
      .sort((a, b) => a[1].length - b[1].length || a[1].localeCompare(b[1]))
      .forEach(([note, letter]) => {
        const p = document.createElement("p");
        p.innerHTML = "<sup>" + letter + "</sup> " + escapeHtml(note);
        fn.appendChild(p);
      });
    container.appendChild(fn);
  }
}

function formatHour(h) {
  const w = h % 24;
  if (w === 0) return "12 AM";
  if (w < 12) return w + " AM";
  if (w === 12) return "12 PM";
  return (w - 12) + " PM";
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
</script>
</body>
</html>
